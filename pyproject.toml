[project]
name = "when-agents-coordinate-replication"
version = "0.0.1"
description = "Replication package for 'When Agents Coordinate: Measuring Coordination in Multi-Agent AI Coding'."
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agent-comms-message-protocol = "agent_comms.message_protocol.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_comms", "agent_comms.message_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
